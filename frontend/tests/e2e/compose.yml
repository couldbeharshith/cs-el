services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: finsync_local
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/00-role.sql:ro
      - ../../lib/supabase/migrations/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
  postgrest:
    image: postgrest/postgrest:v12.2.12
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:finsync_local@postgres:5432/postgres
      PGRST_DB_ANON_ROLE: anon
    ports:
      - "127.0.0.1:54381:3000"
